<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 - Mẹ Quyên</title>
    <!-- Nhúng phông chữ đẹp từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Cài đặt chung */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffd1dc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Hộp chứa nội dung chính */
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 500px;
            position: relative;
            z-index: 10;
            border: 2px solid #fff;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d6336c;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* Nút bấm */
        button {
            background: #d6336c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(214, 51, 108, 0.4);
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
        }

        button:hover {
            background: #c2255c;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(214, 51, 108, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Hộp chứa câu chúc */
        #message-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff0f5;
            border-radius: 15px;
            border-left: 5px solid #d6336c;
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: none;
        }

        #message-box.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Hiệu ứng hoa rơi */
        .flower {
            position: absolute;
            top: -10vh;
            font-size: 1.5rem;
            animation: fall linear forwards;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Các bông hoa rơi sẽ được tạo bằng JS -->
    
    <div class="container">
        <h1>Chúc Mừng Ngày 20/10</h1>
        <h2>Gửi đến Mẹ Quyên yêu quý của con! ❤️</h2>
        
        <button id="btn-greet">Nhận câu chúc</button>
        
        <div id="message-box">
            <p id="message-text"></p>
        </div>
    </div>

    <script>
        // Danh sách các câu chúc dành riêng cho Mẹ Quyên
        const greetings = [
            "Mẹ Quyên ơi, chúc mẹ ngày 20/10 thật nhiều sức khỏe, luôn xinh đẹp rạng rỡ và mãi là người mẹ tuyệt vời nhất trong lòng con nhé! Con yêu mẹ!",
            "Nhân ngày Phụ nữ Việt Nam, con chúc Mẹ Quyên luôn vui vẻ, hạnh phúc. Cảm ơn mẹ đã luôn vất vả, hy sinh vì gia đình. Con thương mẹ rất nhiều!",
            "Mẹ Quyên ơi, chúc mẹ có một ngày 20/10 thật ý nghĩa, luôn trẻ trung, xinh đẹp và gặp nhiều may mắn trong cuộc sống nhé!",
            "Gửi đến Mẹ Quyên yêu dấu: Mẹ là người phụ nữ tuyệt vời nhất! Chúc mẹ 20/10 tràn ngập niềm vui và tiếng cười. Con mãi yêu mẹ!",
            "Chúc mừng ngày 20/10! Chúc mẹ Quyên của con luôn mạnh khỏe, mọi điều ước đều thành hiện thực và luôn tỏa sáng như những bông hoa rực rỡ nhất.",
            "Mẹ Quyên ơi, hôm nay là ngày của mẹ! Chúc mẹ luôn giữ được nụ cười trên môi, mạnh khỏe và bình an. Con tự hào vì có mẹ!",
            "Cảm ơn Mẹ Quyên vì tất cả những gì mẹ đã làm cho con. Chúc mẹ 20/10 thật nhiều niềm vui, ăn nhiều đồ ngon và luôn hạnh phúc bên gia đình nhé!"
        ];

        // Lấy các phần tử HTML
        const btn = document.getElementById('btn-greet');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');

        // Hàm xử lý khi bấm nút
        btn.addEventListener('click', function() {
            // Chọn ngẫu nhiên một câu chúc
            const randomIndex = Math.floor(Math.random() * greetings.length);
            
            // Gán câu chúc vào thẻ p
            messageText.innerText = greetings[randomIndex];
            
            // Hiển thị hộp câu chúc
            messageBox.classList.add('show');
            
            // Đổi hiệu ứng nút một chút để mẹ biết đã click
            btn.innerText = "Nhận câu chúc khác";
            
            // Tạo thêm hiệu ứng hoa rơi
            createFlowers();
        });

        // Hàm tạo hiệu ứng hoa rơi (trái tim và hoa)
        function createFlowers() {
            const emojis = ['🌸', '🌺', '🌹', '💖', '💐', '💕'];
            for (let i = 0; i < 15; i++) {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                // Chọn emoji ngẫu nhiên
                flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                // Vị trí ngẫu nhiên từ trái sang phải
                flower.style.left = Math.random() * 100 + 'vw';
                // Thời gian rơi ngẫu nhiên (từ 2s đến 5s)
                flower.style.animationDuration = (Math.random() * 3 + 2) + 's';
                // Kích thước ngẫu nhiên
                flower.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                
                document.body.appendChild(flower);

                // Xóa bông hoa sau khi rơi xong để không bị nặng web
                setTimeout(() => {
                    flower.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
